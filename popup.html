<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 300px;
      margin: 0;
      padding: 14px;
      font-size: 13px;
      color: #222;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #e9e9e9; }
    button:disabled { opacity: 0.6; cursor: default; }
    .kiOption {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      cursor: pointer;
      user-select: none;
    }
    .kiOption:has(input:disabled) { color: #999; cursor: default; }
    .kiOption input { margin: 0; }
    #kiOptionHinweis { font-size: 11px; color: #999; }
    #status { min-height: 32px; margin: 6px 0; white-space: pre-line; }
    .fehler { color: #b02a37; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
      resize: vertical;
      margin-bottom: 8px;
    }
    .textTreffer {
      padding: 6px 8px;
      margin: 6px 0;
      border-radius: 4px;
      font-size: 12px;
      color: #1f1f1f;
    }
    .textTreffer .ausschnitt { font-style: italic; margin-top: 2px; }
    .textTreffer .grund { margin-top: 2px; }
    .legende { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 8px; }
    .legende div { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .punkt { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
    a { color: #0a58ca; }
    .hinweis { color: #666; font-size: 11.5px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Spot the Bot</h1>
  <label class="kiOption">
    <input type="checkbox" id="mitKi">
    mit KI untersuchen
    <span id="kiOptionHinweis"></span>
  </label>
  <button id="analysieren">Seite analysieren</button>
  <button id="entfernen">Markierungen entfernen</button>
  <button id="textPruefen">Eigenen Text prüfen …</button>
  <div id="textBereich" hidden>
    <textarea id="eigenerText" rows="6" placeholder="Text hier einfügen (mindestens 150 Zeichen), z. B. eine E-Mail oder einen Kommentar"></textarea>
    <button id="textAnalysieren">Text analysieren</button>
    <div id="textErgebnis"></div>
  </div>
  <div id="status"></div>
  <div class="legende" id="legende"></div>
  <div class="hinweis">
    Stilbasierte Einschätzung, kein Nachweis. Begründung je Abschnitt per Maus-Tooltip.
    Ohne API-Key läuft eine lokale Muster-Erkennung; mit Key analysiert Claude genauer.
    <a href="#" id="einstellungen">Einstellungen</a>
  </div>
  <script src="ampel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
